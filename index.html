<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Smart GW - Sistema Comercial para Revendas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* Desktop: Proporção aprovada em 110% */
    @media (min-width: 1025px) {
      html {
        font-size: 17.6px;
        zoom: 1.1;
      }
    }

    /* Mobile: Transforma em App Nativo sem miniaturização */
    @media (max-width: 1024px) {
      html {
        font-size: 15px !important;
        zoom: 1 !important;
      }
      body {
        padding-bottom: 72px; /* Espaço para a Bottom Bar do App */
      }
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    @media print {
      body * { visibility: hidden !important; }
      #printable-receipt-card, #printable-receipt-card * { visibility: visible !important; }
      #printable-receipt-card { 
        position: absolute; 
        left: 0; 
        top: 0; 
        width: 100% !important; 
        margin: 0 !important; 
        padding: 0 !important;
        border: none !important;
      }
    }
    .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.25); border-radius: 9999px; }
  </style>
</head>
<body class="bg-[#0b1322] text-slate-100 flex flex-col min-h-screen overflow-x-hidden selection:bg-blue-600 selection:text-white">

  <!-- ========================================== -->
  <!-- TELA DE LOGIN UNIFICADA                    -->
  <!-- ========================================== -->
  <div id="loginOverlay" class="fixed inset-0 z-50 flex items-center justify-center bg-[#070d1e]/95 backdrop-blur-md px-4">
    <div class="w-full max-w-md bg-[#131d31] border border-slate-700/80 rounded-3xl p-6 sm:p-8 shadow-2xl relative">
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-orange-500 to-amber-500 text-white font-black text-2xl shadow-lg shadow-orange-500/20 mb-3">
          GW
        </div>
        <h2 class="text-2xl font-black tracking-tight text-white">Smart GW</h2>
        <p class="text-xs text-slate-400 mt-1">Gestão Comercial para Revendas de Água, Gás e Gelo</p>
      </div>

      <div id="loginError" class="hidden mb-4 p-3 bg-rose-500/10 border border-rose-500/30 rounded-xl text-xs text-rose-400 flex items-center gap-2">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span>Documento ou senha inválidos.</span>
      </div>

      <form onsubmit="handleUniversalLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">
            Acesso à Revenda (CNPJ, CPF ou E-mail)
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
              <i class="fa-solid fa-id-card"></i>
            </span>
            <input type="text" id="loginIdentifier" required placeholder="Digite seu CNPJ, CPF ou e-mail"
              class="w-full pl-10 pr-4 py-3 bg-[#0b1322] border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-all font-sans">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">
            Senha de Acesso
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input type="password" id="loginSecret" required placeholder="Digite sua senha"
              class="w-full pl-10 pr-4 py-3 bg-[#0b1322] border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-all">
          </div>
        </div>

        <div class="pt-2">
          <button type="submit"
            class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 font-black text-white text-sm rounded-xl shadow-lg shadow-blue-600/30 transition-all flex items-center justify-center gap-2 active:scale-95">
            <i class="fa-solid fa-right-to-bracket"></i>
            <span>Entrar no Sistema</span>
          </button>
        </div>
      </form>

      <div class="mt-6 pt-4 border-t border-slate-800 text-center">
        <span class="text-[11px] text-slate-500 font-mono">Smart GW Enterprise Cloud • v2.6</span>
      </div>
    </div>
  </div>

  <!-- BARRA DE VISUALIZAÇÃO ESPELHO (QUANDO VC ESPELHA OUTRA EMPRESA) -->
  <div id="modoEspelhoBarra" class="hidden bg-gradient-to-r from-amber-600 to-orange-600 text-slate-950 font-bold text-xs py-1.5 px-6 flex items-center justify-between shadow-md sticky top-0 z-40">
    <div class="flex items-center gap-2">
      <i class="fa-solid fa-eye"></i>
      <span>MODO ESPELHO ATIVO: Visualizando como <span id="espelhoNomeEmpresa" class="underline"></span></span>
    </div>
